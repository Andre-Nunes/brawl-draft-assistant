<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brawl Draft Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-5">
    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-amber-400">Brawl Draft Assistant</h1>
      <div class="flex items-center gap-3 text-sm">
        <select id="profileSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5">
          <option value="solo_queue">Perfil: Solo Queue</option>
          <option value="pro_meta">Perfil: Pro Meta</option>
        </select>
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input id="onlyLvl11" type="checkbox" checked class="accent-amber-400 w-4 h-4" />
          <span>Só Nível 11</span>
        </label>
        <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">
          Limpar Draft
        </button>
      </div>
    </div>

    <!-- Seleção de Mapa + Pesquisa Rápida -->
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
        <label class="text-xs uppercase text-slate-400 font-semibold">Mapa Ranked</label>
        <select id="mapSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></select>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 relative">
        <div class="flex items-center justify-between text-xs uppercase text-slate-400 font-semibold">
          <span>Adicionar Brawler (Enter)</span>
          <div class="flex gap-1">
            <button data-target="bans" class="target-btn px-2 py-0.5 rounded bg-rose-600 text-white">Ban (Alt+1)</button>
            <button data-target="my_team" class="target-btn px-2 py-0.5 rounded bg-slate-800">Aliado (Alt+2)</button>
            <button data-target="enemy_team" class="target-btn px-2 py-0.5 rounded bg-slate-800">Inimigo (Alt+3)</button>
          </div>
        </div>
        <input id="brawlerInput" type="text" autocomplete="off"
               placeholder="Escreve o nome (ex: rico, spike) e prime Enter..."
               class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 outline-none rounded-lg px-3 py-2 text-sm" />
        <div id="suggestions" class="hidden absolute left-4 right-4 top-[88px] bg-slate-900 border border-slate-700 rounded-lg shadow-xl z-20 max-h-48 overflow-y-auto"></div>
      </div>
    </div>

    <!-- Estado do Draft -->
    <div class="grid md:grid-cols-3 gap-4">
      <div class="bg-slate-900/70 border border-rose-900/60 rounded-xl p-3">
        <h2 class="text-xs uppercase font-semibold text-rose-400 mb-2">Bans (<span id="bansCount">0</span>/6)</h2>
        <div id="bansList" class="flex flex-wrap gap-1.5 min-h-[32px]"></div>
      </div>
      <div class="bg-slate-900/70 border border-sky-900/60 rounded-xl p-3">
        <h2 class="text-xs uppercase font-semibold text-sky-400 mb-2">Minha Equipa (<span id="myCount">0</span>/3)</h2>
        <div id="myTeamList" class="flex flex-wrap gap-1.5 min-h-[32px]"></div>
      </div>
      <div class="bg-slate-900/70 border border-amber-900/60 rounded-xl p-3">
        <h2 class="text-xs uppercase font-semibold text-amber-400 mb-2">Equipa Inimiga (<span id="enemyCount">0</span>/3)</h2>
        <div id="enemyTeamList" class="flex flex-wrap gap-1.5 min-h-[32px]"></div>
      </div>
    </div>

    <!-- Bans Sugeridos -->
    <div id="bansPanel" class="bg-slate-900 border border-rose-900/50 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm uppercase font-semibold text-rose-400">Bans Sugeridos (clica para banir)</h2>
        <span class="text-xs text-slate-500">Oculta automaticamente ao completar 6 bans</span>
      </div>
      <div id="banResults" class="grid sm:grid-cols-2 lg:grid-cols-5 gap-2"></div>
    </div>

    <!-- Recomendações -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h2 class="text-sm uppercase font-semibold text-slate-300 mb-3">Melhores Picks Recomendados</h2>
      <div id="results" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const state = { map_name: "", bans: [], my_team: [], enemy_team: [], profile: "solo_queue", only_level_11: true };
    let allBrawlers = [];
    let activeTarget = "bans";
    let currentMatches = [];

    const els = {
      map: document.getElementById("mapSelect"),
      profile: document.getElementById("profileSelect"),
      lvl11: document.getElementById("onlyLvl11"),
      input: document.getElementById("brawlerInput"),
      sugg: document.getElementById("suggestions"),
      results: document.getElementById("results"),
      banPanel: document.getElementById("bansPanel"),
      banResults: document.getElementById("banResults"),
    };

    const targetColors = {
      bans: "bg-rose-600 text-white",
      my_team: "bg-sky-600 text-white",
      enemy_team: "bg-amber-600 text-white",
    };

    function setTarget(target) {
      activeTarget = target;
      document.querySelectorAll(".target-btn").forEach(btn => {
        const isSelected = btn.dataset.target === target;
        btn.className = `target-btn px-2 py-0.5 rounded ${isSelected ? targetColors[target] : "bg-slate-800 text-slate-300"}`;
      });
      els.input.focus();
    }

    function addBrawler(name) {
      const upper = name.toUpperCase();
      const used = new Set([...state.bans, ...state.my_team, ...state.enemy_team]);
      const limits = { bans: 6, my_team: 3, enemy_team: 3 };
      if (!allBrawlers.includes(upper) || used.has(upper) || state[activeTarget].length >= limits[activeTarget]) return;

      state[activeTarget].push(upper);
      els.input.value = "";
      els.sugg.classList.add("hidden");
      renderChips();
      fetchRecommendations();
    }

    function removeBrawler(target, name) {
      state[target] = state[target].filter(b => b !== name);
      renderChips();
      fetchRecommendations();
    }

    function renderChips() {
      const configs = [
        ["bans", "bansList", "bansCount", "bg-rose-950 text-rose-200 border-rose-700"],
        ["my_team", "myTeamList", "myCount", "bg-sky-950 text-sky-200 border-sky-700"],
        ["enemy_team", "enemyTeamList", "enemyCount", "bg-amber-950 text-amber-200 border-amber-700"],
      ];
      configs.forEach(([key, listId, countId, cls]) => {
        document.getElementById(countId).textContent = state[key].length;
        document.getElementById(listId).innerHTML = state[key]
          .map(b => `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium border ${cls}">
            ${b} <button onclick="removeBrawler('${key}', '${b}')" class="hover:text-white">×</button>
          </span>`).join("");
      });
    }

    function quickBan(name) {
      if (state.bans.length >= 6 || state.bans.includes(name)) return;
      state.bans.push(name);
      renderChips();
      fetchRecommendations();
    }

    async function fetchBans() {
      const showBans = state.bans.length < 6 && state.my_team.length === 0 && state.enemy_team.length === 0;
      els.banPanel.classList.toggle("hidden", !showBans);
      if (!showBans || !state.map_name) return;

      const res = await fetch("/api/bans", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state),
      });
      const bans = await res.json();
      els.banResults.innerHTML = bans.map(b => `
        <button onclick="quickBan('${b.brawler}')"
                class="text-left bg-slate-950 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-700 rounded-lg p-2.5 transition">
          <div class="flex items-center justify-between gap-1">
            <span class="font-bold text-sm text-slate-100 truncate">${b.brawler}</span>
            <span class="text-xs font-semibold text-rose-400">${b.score}%</span>
          </div>
          <div class="text-[11px] text-slate-400 mt-1 line-clamp-2">${b.reasons.join(" · ")}</div>
        </button>
      `).join("");
    }

    async function fetchRecommendations() {
      fetchBans();
      if (!state.map_name) return;
      const res = await fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state),
      });
      const riskStyles = {
        "Baixo": "bg-emerald-950 text-emerald-300 border-emerald-800",
        "Médio": "bg-amber-950 text-amber-300 border-amber-800",
        "Alto":  "bg-rose-950 text-rose-300 border-rose-800",
      };
      const recs = await res.json();
      els.results.innerHTML = recs.map((r, i) => `
        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3">
          <div class="flex items-center gap-3">
            <span class="text-lg font-bold text-slate-500 w-6">#${i + 1}</span>
            <div>
              <div class="font-bold text-base flex items-center gap-2">
                <span>${r.brawler}</span>
                <span class="text-xs px-1.5 py-0.5 rounded bg-slate-800 text-amber-300">Tier ${r.tier}</span>
                <span class="text-xs px-1.5 py-0.5 rounded border ${riskStyles[r.risk] || ''}">Risco ${r.risk}</span>
              </div>
              <div class="text-xs text-slate-400">${r.reasons.join(" · ")}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-lg font-bold text-emerald-400">${r.score}%</div>
          </div>
        </div>
      `).join("") || `<p class="text-sm text-slate-500">Sem recomendações disponíveis.</p>`;
    }

    els.input.addEventListener("input", () => {
      const q = els.input.value.trim().toUpperCase();
      const used = new Set([...state.bans, ...state.my_team, ...state.enemy_team]);
      currentMatches = q ? allBrawlers.filter(b => b.includes(q) && !used.has(b)).slice(0, 8) : [];
      if (!currentMatches.length) {
        els.sugg.classList.add("hidden");
        return;
      }
      els.sugg.innerHTML = currentMatches.map(b =>
        `<div class="px-3 py-2 text-sm hover:bg-slate-800 cursor-pointer" onclick="addBrawler('${b}')">${b}</div>`
      ).join("");
      els.sugg.classList.remove("hidden");
    });

    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && currentMatches.length) {
        e.preventDefault();
        addBrawler(currentMatches[0]);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.altKey && e.key === "1") setTarget("bans");
      if (e.altKey && e.key === "2") setTarget("my_team");
      if (e.altKey && e.key === "3") setTarget("enemy_team");
    });

    document.querySelectorAll(".target-btn").forEach(btn =>
      btn.addEventListener("click", () => setTarget(btn.dataset.target))
    );

    els.map.addEventListener("change", () => { state.map_name = els.map.value; fetchRecommendations(); });
    els.profile.addEventListener("change", () => { state.profile = els.profile.value; fetchRecommendations(); });
    els.lvl11.addEventListener("change", () => { state.only_level_11 = els.lvl11.checked; fetchRecommendations(); });
    document.getElementById("resetBtn").addEventListener("click", () => {
      state.bans = []; state.my_team = []; state.enemy_team = [];
      renderChips(); fetchRecommendations(); els.input.focus();
    });

    async function init() {
      const res = await fetch("/api/meta");
      const meta = await res.json();
      allBrawlers = meta.brawlers;
      els.map.innerHTML = meta.maps.map(m => `<option value="${m}">${m}</option>`).join("");
      state.map_name = meta.maps[0] || "";
      renderChips();
      fetchRecommendations();
      els.input.focus();
    }
    init();
  </script>
</body>
</html>
